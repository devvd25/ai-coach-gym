services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ai-coach-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
    # Bind to localhost only so the database is not reachable from the network.
    ports:
      - '127.0.0.1:${DB_PORT:-1433}:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  sqlserver-data:
